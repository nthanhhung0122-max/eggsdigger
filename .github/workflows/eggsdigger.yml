name: Eggs Digger 24/7 Automation

on:
  schedule:
    # Chay lap lai moi 10 phut toi uu nang suat dap trung va dao khoang
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: eggsdigger-run
  cancel-in-progress: true

jobs:
  run-eggsdigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install telethon requests

      - name: Run Eggs Digger Pro Auto
        env:
          TELEGRAM_SESSIONS: ${{ secrets.TELEGRAM_SESSIONS }}
        run: |
          python auto_eggsdigger.py
